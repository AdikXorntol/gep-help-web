<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEP Help</title>
<meta name="description" content="Tutorial bergambar dan video untuk GEP APP, GEP OPS dan GEP LITE. Picture and video tutorials for GEP APP, GEP OPS and GEP LITE.">
<meta name="theme-color" content="#FFC20E">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Start downloading the interface text for the likely language right away.
  (function () {
    var l = '';
    try { l = JSON.parse(localStorage.getItem('gep_lang') || '""'); } catch (e) { l = ''; }
    if (l !== 'ms' && l !== 'en') l = /^ms/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'ms' : 'en';
    var k = document.createElement('link');
    k.rel = 'preload'; k.as = 'fetch'; k.href = 'i18n/' + l + '.json'; k.crossOrigin = 'anonymous';
    document.head.appendChild(k);
  })();
</script>
<link rel="stylesheet" href="css/app.css">
<script src="config.js" defer></script>
<script src="js/util.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<div id="app">
  <noscript><p style="padding:24px;font-family:sans-serif">GEP Help perlukan JavaScript. Sila hidupkan JavaScript dalam pelayar anda. / GEP Help needs JavaScript. Please turn on JavaScript in your browser.</p></noscript>
</div>
<div id="layers"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
