name: Keep Supabase awake

# Free Supabase projects pause after 7 days with little activity.
# This makes one small read every 2 days, using the public URL and anon key from web/config.js.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          url=$(grep -oE "supabaseUrl: *'[^']*'" web/config.js | sed -E "s/.*'([^']*)'/\1/")
          key=$(grep -oE "supabaseAnonKey: *'[^']*'" web/config.js | sed -E "s/.*'([^']*)'/\1/")
          if [ -z "$url" ] || [ -z "$key" ]; then echo "config.js has no Supabase keys yet (demo mode); nothing to do."; exit 0; fi
          curl -fsS "$url/rest/v1/tetapan?select=id" -H "apikey: $key" && echo && echo "Supabase is awake."
